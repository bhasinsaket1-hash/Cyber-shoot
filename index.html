[[0,-40.5,82,1,5],[0,40.5,82,1,5],[-40.5,0,1,82,5],[40.5,0,1,82,5]].forEach(a=>box(...a,0x1a2030,nC));
[[-18,-16,10,8,7,0x2a3142,nC],[20,-22,12,9,8,0x35283f,nM],[22,18,8,12,6,0x2a3142,nM],[-24,20,10,10,5,0x302c3c,nC],[0,-8,3,3,1.6,0x4a4030,nM],[-6,4,3,3,1.6,0x4a4030,nC],[8,6,2,2,1.2,0x3a4a3a,nC],
[-10,-4,6,1,1.4,0x444,nM],[12,-10,1,6,1.4,0x444,nC],[0,14,7,1,1.4,0x444,nM],[-30,0,2,12,3,0x2a3142,nC],[30,0,2,14,3,0x2a3142,nM],[4,26,4,4,2.5,0x35283f,nC],[-14,30,5,3,2.5,0x302c3c,nM]].forEach(a=>box(...a));

/* dust */

const settings=()=>`<div class="set"><label>SENSITIVITY <input type="range" min=".4" max="2" step=".1" value="${save.sens}" oninput="save.sens=+this.value" onchange="persist()"></label><button class="btn" data-a="gfx">GRAPHICS: ${save.gfx?'HIGH':'LOW'}</button><button class="btn" data-a="assist">AIM ASSIST: ${save.assist?'ON':'OFF'}</button></div>`;

function showMenu(){view=showMenu;resetZ();setS('menu');for(let i=0;i<7;i++){const z=spawnZ(i%5,{x:(Math.random()-.5)*26,z:-5-Math.random()*14});z.st='idle'}

O.onclick=e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i;A.click();
if(a==='play'||a==='restart')startGame();else if(a==='resume'){hideOv();setS('play');lock()}else if(a==='quit')showMenu();
else if(a==='next'){hideOv();setS('play');P.hp=Math.min(100,P.hp+40);P.ar=50;refill();lock();startWave()}
else if(a==='eq'){cur=i;view()}else if(a==='up'){const c=300*save.lv[i];if(save.coins>=c&&save.lv[i]<5){save.coins-=c;save.lv[i]++;persist();view()}else toast('NOT ENOUGH COINS','hs')}
else if(a==='gfx'){save.gfx=save.gfx?0:1;persist();gfx();view()}else if(a==='assist'){save.assist=save.assist?0:1;persist();view()}};
/* ---------- GAME FLOW ---------- */
function resetZ(){for(const z of ZA){z.g.visible=false;ZP.push(z)}ZA.length=0}
function startGame(){resetZ();P.pos.set(0,0,6);Object.assign(P,{vy:0,yaw:0,pitch:.15,hp:100,ar:50});wave=0;xp=0;queue=0;waveActive=false;shopT=0;nextT=1.3;rel=false;ads=false;refill();hideOv();setS('play');lock();banner('GET READY')}
function startWave(){wave++;queue=6+wave*4;spawnT=.5;waveActive=true;banner('WAVE '+wave);A.wave()}
const pickType=()=>{const r=Math.random(),w=wave;return w>=5&&r<.04+.01*w?0:w>=4&&r<.16?1:w>=3&&r<.3?2:w>=2&&r<.55?3:4};
function spawnPos(){for(let i=0;i<20;i++){const a=Math.random()*6.283,r=26+Math.random()*12,x=Math.max(-38,Math.min(38,Math.cos(a)*r)),z=Math.max(-38,Math.min(38,Math.sin(a)*r));if(Math.hypot(x-P.pos.x,z-P.pos.z)>18){const p={x,y:0,z};push(p,1.3);return p}}return{x:30,y:0,z:30}}
function waves(dt){if(nextT>0){nextT-=dt;if(nextT<=0)startWave()}
let alive=0;for(const z of ZA)if(z.st!=='dead')alive++;left=queue+alive;
if(waveActive){if(queue>0){spawnT-=dt;if(spawnT<=0&&alive<10+Math.min(12,wave)){spawnZ(pickType(),spawnPos());queue--;spawnT=Math.max(.3,1.1-wave*.05)}}
else if(alive===0){waveActive=false;save.coins+=500;xp+=100*wave;if(wave>save.best)save.best=wave;persist();banner('WAVE COMPLETE');toast('+500 ◈ COINS &nbsp; +'+100*wave+' XP','gold');A.wave();shopT=2.6}}
if(shopT>0){shopT-=dt;if(shopT<=0&&state==='play'){setS('shop');document.exitPointerLock&&document.exitPointerLock();shopView()}}}
function hurt(d){if(state!=='play')return;if(P.ar>0){const a=Math.min(P.ar,d*.6);P.ar-=a;d-=a}P.hp-=d;hurtT=.35;A.hurt();if(P.hp<=0)die()}
function kill(z,hd){z.st='dead';z.dt=0;const c=Math.round(z.ty.hp/20),x=Math.round(z.ty.hp/10);save.coins+=c;xp+=x;A.zdie();toast((hd?'HEADSHOT · ':'')+z.ty.n.toUpperCase()+' KILLED +'+c+'◈ +'+x+'XP',hd?'hs':'')}
/* ---------- WEAPONS ---------- */
function reload(){const s=stats(cur),a=AM[cur];if(rel||a.mag>=s.mag||a.res<=0)return;rel=true;relT=s.rel;A.rel()}
function sw(i){if(i<0||i>4||i===cur)return;cur=i;rel=false;last=performance.now()+150;A.click();WN.classList.remove('sw');void WN.offsetWidth;WN.classList.add('sw')}
function shoot(s,a){const w=WP[cur],n=performance.now();last=n;fireEdge=false;
if(a.mag<=0){A.empty();reload();return}
a.mag--;cam.getWorldDirection(dv);ov3.copy(cam.position);
const sp=s.spr*(ads?.35:1)*(P.spd>.5?1.6:1)*(P.pos.y>0?2:1),tg=obM.slice();for(const z of ZA)if(z.st!=='dead'&&z.st!=='idle')tg.push(...z.meshes);
gun.localToWorld(mzv.set(0,0,-.45));const hits=new Map();
for(let p=0;p<w.pel;p++){tv.set(dv.x+(Math.random()-.5)*sp*2,dv.y+(Math.random()-.5)*sp*2,dv.z+(Math.random()-.5)*sp*2).normalize();
RC.set(ov3,tv);RC.far=w.rng+6;const h=RC.intersectObjects(tg,false)[0];
if(h){ep.copy(h.point);const z=h.object.userData.z;if(z){const hd=!!h.object.userData.head,d=s.dmg*(hd?2.2:1)*(1-Math.min(1,h.distance/w.rng)*.4),r=hits.get(z)||{d:0,hd:false,p:h.point.clone()};r.d+=d;r.hd=r.hd||hd;hits.set(z,r);burst(h.point,true)}else burst(h.point,false)}
else ep.copy(ov3).addScaledVector(tv,w.rng);
if(p<3)tracer(mzv,ep)}
hits.forEach((r,z)=>{const d=Math.round(r.d);z.hp-=d;z.hitT=.15;dn(r.p,d,r.hd);hm(r.hd);r.hd?A.head():A.hit();if(z.hp<=0)kill(z,r.hd)});
kick+=s.rec;flash.position.copy(mzv);flash.intensity=4;A.shot(cur);if(touchMode&&navigator.vibrate)navigator.vibrate(12);if(a.mag<=0)reload()}
function weapons(dt){const s=stats(cur),a=AM[cur];
if(rel){relT-=dt;if(relT<=0){const t=Math.min(s.mag-a.mag,a.res);a.mag+=t;a.res-=t;rel=false}}
if(fireHeld&&!rel&&performance.now()-last>60000/s.rpm&&(WP[cur].auto||fireEdge))shoot(s,a);
if(!fireHeld)fireEdge=false;kick*=Math.exp(-dt*9);flash.intensity*=Math.exp(-dt*30)}
/* ---------- PLAYER / CAMERA ---------- */
function updP(dt){let mx=(keys.d|0)-(keys.a|0)+joy.x,mz=(keys.s|0)-(keys.w|0)+joy.y;const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
crch=!!keys.c||mobC;const spr=(keys.shift||joy.full)&&l>.2&&!ads&&!crch;P.sprinting=spr;
const spd=(crch?3.6:spr?12.5:7.8)*(ads?.7:1)*WP[cur].pen,sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);P.spd=Math.min(1,l)*spd;
P.pos.x+=(cy*mx+sy*mz)*spd*dt;P.pos.z+=(-sy*mx+cy*mz)*spd*dt;
if((keys.sp||jumpReq)&&P.pos.y<=0)P.vy=7.5;jumpReq=false;P.vy-=22*dt;P.pos.y+=P.vy*dt;if(P.pos.y<=0){P.pos.y=0;P.vy=0}
P.pos.x=Math.max(-39,Math.min(39,P.pos.x));P.pos.z=Math.max(-39,Math.min(39,P.pos.z));push(P.pos,.45);
pg.position.copy(P.pos);pg.rotation.y=P.yaw;pg.scale.y=crch?.8:1;const w=Math.sin(tm*10)*Math.min(1,P.spd/4)*.8;legL.rotation.x=w;legR.rotation.x=-w;
if(hurtT>0)hurtT-=dt}
function assist(dt){tgt=null;let ba=9;cam.getWorldDirection(dv);const w=WP[cur];
for(const z of ZA){if(z.st==='dead')continue;tv.set(z.g.position.x,1.1*z.ty.sc,z.g.position.z).sub(cam.position);const L=tv.length();if(L>w.rng||L<1)continue;const an=Math.acos(Math.min(1,tv.dot(dv)/L));if(an<Math.atan(.55*z.ty.sc/L)+.03&&an<ba){ba=an;tgt=z;tv2.copy(tv)}}
if(tgt&&save.assist&&(fireHeld||ads)){const ty=Math.atan2(-tv2.x,-tv2.z),tp=Math.asin(tv2.y/tv2.length());let dy=ty-P.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));const k=Math.min(1,dt*2.5)*.3;P.yaw+=dy*k;P.pitch+=(tp-P.pitch-kick)*k}}
function updCam(dt){const h=crch?1.15:1.6;head.set(P.pos.x,P.pos.y+h,P.pos.z);const k=Math.min(1,dt*10);camDist+=((ads?2.3:4.2)-camDist)*k;camSh+=((ads?.5:.85)-camSh)*k;
const pi=P.pitch+kick,cp=Math.cos(pi),sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
ep.set(head.x+sy*cp*camDist+cy*camSh,head.y-Math.sin(pi)*camDist+.2,head.z+cy*cp*camDist-sy*camSh);
tv.copy(ep).sub(head);const L=tv.length();tv.divideScalar(L);RC.set(head,tv);RC.far=L;const hh=RC.intersectObjects(obM,false)[0];if(hh)ep.copy(head).addScaledVector(tv,Math.max(.6,hh.distance-.3));
ep.y=Math.max(.3,ep.y);cam.position.copy(ep);cam.rotation.set(pi,P.yaw,0);
const tf=ads?70/WP[cur].zoom:(P.sprinting?78:70);if(Math.abs(cam.fov-tf)>.05){cam.fov+=(tf-cam.fov)*k;cam.updateProjectionMatrix()}}
/* ---------- ZOMBIE AI ---------- */
function updZ(dt){const pp=P.pos;
for(let i=ZA.length-1;i>=0;i--){const z=ZA[i],g=z.g,gp=g.position;
if(z.st==='dead'){z.dt+=dt;g.rotation.x=-Math.min(1.5,z.dt*6);if(z.dt>1.4){g.visible=false;ZA.splice(i,1);ZP.push(z)}continue}
if(z.st==='idle'){g.rotation.y=Math.atan2(-gp.x,-gp.z);gp.y=Math.sin(tm*2+z.ph)*.03;continue}
const dx=pp.x-gp.x,dz=pp.z-gp.z,d=Math.hypot(dx,dz)||.001,nx=dx/d,nz=dz/d;
z.hitT-=dt;z.atkT-=dt;z.sT-=dt;z.mat.emissive.setHex(z.hitT>0?0x771111:0);
const sp=z.sp*(z.hitT>0?.3:1),bx=gp.x,bz=gp.z;
if(d>1.3*z.ty.sc){z.st=z.hitT>0?'hit':'chase';let mx=nx,mz2=nz;if(z.sT>0){mx=-nz*z.sd;mz2=nx*z.sd}gp.x+=mx*sp*dt;gp.z+=mz2*sp*dt}
else{z.st='attack';if(z.atkT<=0){z.atkT=z.ty.atk;hurt(z.dmg)}}
for(let j=0;j<ZA.length;j++){if(j===i)continue;const o=ZA[j];if(o.st==='dead')continue;const ex=gp.x-o.g.position.x,ez=gp.z-o.g.position.z,e2=ex*ex+ez*ez;if(e2<.7&&e2>1e-4){const e=Math.sqrt(e2),f=(.85-e)*.5;gp.x+=ex/e*f;gp.z+=ez/e*f}}
push(gp,.5*z.ty.sc);
if(d>3&&z.st==='chase'&&z.sT<=0&&Math.hypot(gp.x-bx,gp.z-bz)<sp*dt*.25){z.sT=.8;z.sd=Math.random()<.5?1:-1}
g.rotation.y=Math.atan2(-dx,-dz);gp.y=Math.abs(Math.sin(tm*6+z.ph))*.06;g.rotation.z=Math.sin(tm*5+z.ph)*.05}}
function fx(dt){for(const o of PT)if(o.l>0){o.l-=dt;o.v.y-=14*dt;o.m.position.addScaledVector(o.v,dt);o.m.scale.setScalar(Math.max(.01,o.l*2));if(o.l<=0)o.m.visible=false}
for(const o of TR)if(o.t>0){o.t-=dt;if(o.t<=0)o.l.visible=false}}
const st=(el,t)=>{if(el._t!==t){el._t=t;el.textContent=t}};
function hud(){const s=stats(cur),a=AM[cur];st($('wv'),'WAVE '+wave);st($('zl'),'ZOMBIES LEFT '+left);st($('cn'),'◈ '+save.coins+' · XP '+xp);
$('hb').style.width=Math.max(0,P.hp)+'%';$('ab').style.width=P.ar*2+'%';st(WN,WP[cur].n.toUpperCase()+' · LV'+save.lv[cur]);st($('am'),rel?'RELOADING…':a.mag+' / '+a.res);
CR.className=tgt?'t':'';st(TG,tgt?tgt.ty.n.toUpperCase()+' '+Math.ceil(tgt.hp)+'/'+tgt.ty.hp:'');
$('vg').style.opacity=Math.max(hurtT*2,P.hp<35?.45+.3*Math.sin(tm*6):0)}
/* ---------- LOOP ---------- */
let pt=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-pt)/1000);pt=now;tm+=dt;
pl1.position.set(Math.sin(tm*.5)*18,4,Math.cos(tm*.4)*18);pl2.position.set(Math.cos(tm*.3)*22,4,Math.sin(tm*.35)*22);
for(let i=0;i<DN;i++){dp[i*3+1]+=dt*.5;dp[i*3]+=Math.sin(tm+i)*dt*.3;if(dp[i*3+1]>14)dp[i*3+1]=0}dg.attributes.position.needsUpdate=true;
if(state==='play'){updP(dt);assist(dt);weapons(dt);updZ(dt);waves(dt);fx(dt);updCam(dt);hud()}
else if(state==='menu'||state==='dead'){const a=tm*.15;cam.position.set(Math.sin(a)*34,12+Math.sin(tm*.3)*2,Math.cos(a)*34);cam.lookAt(0,1.5,0);updZ(dt);fx(dt)}
R.render(S,cam)}
/* ---------- INPUT ---------- */
const KM={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ShiftLeft:'shift',ShiftRight:'shift',Space:'sp',KeyC:'c',ControlLeft:'c'};

$('pz').onclick=pause;
const jz=$('jz'),lz=$('lz'),jb=$('jb'),jk=$('jk');let jid=null,jc={x:0,y:0},lid=null,lp={x:0,y:0};
jz.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];jid=t.identifier;jc={x:t.clientX,y:t.clientY};jb.style.cssText=`display:block;left:${t.clientX-55}px;top:${t.clientY-55}px`},{passive:false});
jz.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jid){let dx=(t.clientX-jc.x)/50,dy=(t.clientY-jc.y)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;joy.full=l>.75;jk.style.transform=`translate(${dx*30}px,${dy*30}px)`}},{passive:false});
const jend=e=>{for(const t of e.changedTouches)if(t.identifier===jid){jid=null;joy.x=joy.y=0;joy.full=false;jb.style.display='none'}};jz.addEventListener('touchend',jend);jz.addEventListener('touchcancel',jend);

gfx();showMenu();requestAnimationFrame(loop);
